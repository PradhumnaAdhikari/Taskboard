services:

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:    
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: taskboard
      DB_USER: taskboard
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taskboard
      MYSQL_USER: taskboard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD","mysqladmin","ping","-h","localhost","-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  mysql_data:

